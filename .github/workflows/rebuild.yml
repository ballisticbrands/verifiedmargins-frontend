# Rebuild so profile pages reflect fresh data.
#
# Profile pages are generated at BUILD time (scripts/build-profiles.mjs) — that
# is what makes them readable by search engines and AI assistants, since this
# app is client-rendered and a crawler gets the static block or nothing. So a
# page is only ever as current as the last deploy, in two ways:
#
#   1. A profile PUBLISHED since the last build is served by 404.html. It works
#      for a human (the client route fetches live) but answers HTTP 404, so
#      crawlers skip it.
#   2. A profile whose NUMBERS changed still shows the old ones to crawlers.
#      This bit immediately: the snapshot job populated ggballas with $83k of
#      verified revenue while the static page still read "No connected account.
#      Nothing on this page is verified."
#
# 🕐 09:10 UTC is deliberate — it runs AFTER the box's 08:30 UTC
# profile-snapshots cron, which itself runs after the 06:00 UTC resync it reads
# from. Rebuild before the snapshot and every page is a day stale by
# construction. The chain is: resync → snapshot → rebuild.
#
# If profiles ever get frequent, replace this with a repository_dispatch fired
# by the backend on publish. A poll that rebuilds an unchanged site is waste; a
# poll that misses a publish by an hour is a bad first impression.
name: Rebuild profile pages

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  # Required — @ballisticbrands/frontend-shared is a private GitHub Packages
  # dependency, and without this the job's GITHUB_TOKEN gets
  # "403 Permission installation not allowed to Read organization package".
  # deploy.yml has it; omitting it here is exactly why the first run failed.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@ballisticbrands"
      - run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAD0Om6EwWjyl-CF4"
          VITE_GOOGLE_CLIENT_ID: "776606808148-8p8l20pg1vt4jcbde2rr1orvlku87b55.apps.googleusercontent.com"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
